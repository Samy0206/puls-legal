<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Impressum</title><style>
:root{color-scheme:light dark;--bg:#f8f8fa;--fg:#14201c;--muted:#5f6b68;--line:#e3e7e6;--accent:#245a4e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--fg:#eef4f1;--muted:#9db0aa;--line:#2c3d38;--accent:#5ce59e;--card:#1a2723}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:20px 20px 64px}
h1{font-size:1.7rem;line-height:1.2;margin:.6em 0 .4em}
h2{font-size:1.25rem;margin:1.8em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.4em 0 .4em}
p,li{margin:.5em 0}
a{color:var(--accent)}
blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--accent);background:var(--card);border-radius:8px}
table{width:100%;border-collapse:collapse;margin:1em 0;font-size:.92rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:.5em .6em;text-align:left;vertical-align:top}
th{background:var(--card)}
code{background:var(--card);padding:.1em .3em;border-radius:4px;font-size:.9em}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
</style></head><body><main><h1>Impressum</h1>

Deutschland</p>

</main></body></html>
